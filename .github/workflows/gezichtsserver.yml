name: gezichtsserver

on:
  push:
    tags: ["gezicht-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: versie
        run: echo "tag=${GITHUB_REF_NAME#gezicht-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: gezichtsserver
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/bogaertm/btx-gezichtsserver:${{ steps.versie.outputs.tag }}
            ghcr.io/bogaertm/btx-gezichtsserver:latest
