<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ED6928">
<title>Toegang</title>
<style>
  :root { --o: #ED6928; --g: #F59E32; --tekst: #1d1d1f; --zacht: #6b6b70; --lijn: #e3e3e6; --vlak: #f6f6f7; --kaart: #fff; --fout: #c62828; --ok: #0b8043; --bg: #fafafa; }
  @media (prefers-color-scheme: dark) { :root { --tekst: #f2f2f4; --zacht: #a6a6ad; --lijn: #34343a; --vlak: #232327; --kaart: #1a1a1d; --bg: #111113; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--tekst); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .kop { background: var(--o); color: #fff; padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 22px; }
  .kop .merk { font-weight: 700; letter-spacing: 0.02em; opacity: 0.95; }
  .kop h1 { margin: 6px 0 0; font-size: 1.5rem; font-weight: 600; line-height: 1.25; }
  .kop p { margin: 6px 0 0; opacity: 0.95; }
  main { max-width: 560px; margin: -10px auto 0; padding: 0 14px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .kaart { background: var(--kaart); border: 1px solid var(--lijn); border-radius: 16px; padding: 18px; margin-top: 14px; }
  .kaart h2 { margin: 0 0 4px; font-size: 1.1rem; font-weight: 600; display: flex; gap: 10px; align-items: center; }
  .nr { width: 26px; height: 26px; border-radius: 50%; background: var(--o); color: #fff; font-size: 0.85rem; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .uitleg { color: var(--zacht); font-size: 0.92rem; margin: 0 0 12px; }
  label { display: block; font-size: 0.9rem; color: var(--zacht); margin: 12px 0 4px; }
  input[type=text], input[type=tel], input[type=email], input[type=password] { width: 100%; font: inherit; font-size: 1.05rem; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--lijn); background: var(--kaart); color: var(--tekst); min-height: 50px; }
  input:focus { outline: 2px solid var(--o); outline-offset: 1px; border-color: transparent; }
  input.pin { letter-spacing: 6px; font-size: 1.4rem; text-align: center; font-variant-numeric: tabular-nums; }
  .twee { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 380px) { .twee { grid-template-columns: 1fr; } }
  .knop { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; border-radius: 14px; border: 0;
    background: var(--o); color: #fff; font: inherit; font-weight: 600; font-size: 1.05rem; cursor: pointer; padding: 0 16px; margin-top: 14px; text-decoration: none; }
  .knop.zacht { background: var(--vlak); color: var(--tekst); border: 1px solid var(--lijn); font-weight: 500; }
  .knop:disabled { opacity: 0.6; }
  .foto { display: flex; gap: 14px; align-items: center; }
  .foto .voorbeeld { width: 96px; height: 96px; border-radius: 50%; background: var(--vlak); border: 2px dashed var(--lijn); flex: none; overflow: hidden;
    display: flex; align-items: center; justify-content: center; color: var(--zacht); font-size: 2rem; }
  .foto .voorbeeld img { width: 100%; height: 100%; object-fit: cover; }
  .foto .knoppen { flex: 1; }
  .foto .knop { margin-top: 0; }
  .foto .knop + .knop { margin-top: 8px; }
  input[type=file] { display: none; }
  .vink { display: flex; gap: 12px; align-items: flex-start; margin-top: 12px; color: var(--tekst); font-size: 0.95rem; }
  .vink input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--o); flex: none; }
  details { margin-top: 10px; background: var(--vlak); border-radius: 12px; padding: 10px 14px; }
  details summary { cursor: pointer; font-weight: 500; }
  details p { font-size: 0.9rem; color: var(--zacht); margin: 8px 0; }
  .melding { border-radius: 12px; padding: 12px 14px; margin-top: 14px; font-size: 0.95rem; display: none; }
  .melding.fout { display: block; background: rgba(198, 40, 40, 0.1); color: var(--fout); }
  .melding.ok { display: block; background: rgba(11, 128, 67, 0.1); color: var(--ok); }
  .rij { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--lijn); }
  .rij:last-child { border-bottom: 0; }
  .rij span:first-child { color: var(--zacht); }
  .rij span:last-child { text-align: right; }
  .chip { display: inline-block; background: var(--vlak); border-radius: 20px; padding: 2px 10px; margin: 2px 0 2px 4px; font-size: 0.9rem; }
  .status { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #0288d1; display: inline-block; }
  .dot.blocked { background: #f4b400; } .dot.retired { background: #9e9e9e; }
  .profiel { display: flex; gap: 16px; align-items: center; }
  .profiel .voorbeeld { width: 72px; height: 72px; border-radius: 50%; overflow: hidden; background: var(--vlak); flex: none; }
  .profiel .voorbeeld img { width: 100%; height: 100%; object-fit: cover; }
  .profiel b { font-size: 1.2rem; display: block; }
  .binnenkort { opacity: 0.75; }
  .label { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--vlak); color: var(--zacht); margin-left: 6px; }
  .klein { font-size: 0.85rem; color: var(--zacht); }
  .verborgen { display: none !important; }
  .link { word-break: break-all; background: var(--vlak); padding: 10px 12px; border-radius: 10px; font-size: 0.9rem; }
  .laden { text-align: center; color: var(--zacht); padding: 40px 0; }
  .camera { position: relative; width: 100%; aspect-ratio: 3 / 4; background: #000; border-radius: 16px; overflow: hidden; margin-top: 12px; }
  .camera video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .camera .ovaal { position: absolute; left: 50%; top: 46%; width: 62%; height: 62%; transform: translate(-50%, -50%); border-radius: 50%;
    border: 4px solid rgba(255, 255, 255, 0.55); box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35); transition: border-color 0.2s; }
  .camera .ovaal.goed { border-color: #3ddc84; }
  .camera .tip { position: absolute; left: 12px; right: 12px; bottom: 12px; background: rgba(0, 0, 0, 0.6); color: #fff; border-radius: 12px;
    padding: 10px 12px; text-align: center; font-weight: 600; font-size: 1.05rem; }
  .stippen { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .stippen span { width: 12px; height: 12px; border-radius: 50%; background: var(--lijn); }
  .stippen span.ok { background: var(--o); }
  .stippen span.over { background: var(--zacht); opacity: 0.4; }
  .toestemming { background: var(--vlak); border-radius: 12px; padding: 12px 14px; font-size: 0.92rem; margin-top: 10px; }
  .waarschuwing { background: rgba(244, 180, 0, 0.15); border-radius: 12px; padding: 10px 12px; font-size: 0.92rem; margin-top: 10px; }
</style>
</head>
<body>
<div class="kop"><div class="merk" id="merk">Btechnics</div><h1 id="titel">Toegang</h1><p id="ondertitel"></p></div>
<main id="main"><div class="laden">Laden...</div></main>
<script>
"use strict";
// het pad wisselt na het aanmelden (uitnodiging naar vaste link), dus telkens opnieuw lezen
const apiPad = () => location.pathname.replace(/\/$/, "");
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const DAGEN = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"];
const MAANDEN = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
const WEEK = ["", "Ma", "Di", "Wo", "Do", "Vr", "Za", "Zo"];
let INFO = null, FOTO = null;

function datum(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: INFO.tijdzone, weekday: "short", year: "numeric", month: "numeric",
    day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d).map((x) => [x.type, x.value]));
  const wd = new Date(Date.UTC(+p.year, +p.month - 1, +p.day)).getUTCDay();
  return `${DAGEN[wd]} ${+p.day} ${MAANDEN[+p.month - 1]} ${p.year}, ${p.hour}u${p.minute}`;
}
function dagen(ds) {
  const s = [...ds].sort((a, b) => a - b).join();
  if (s === "1,2,3,4,5,6,7") return "elke dag";
  if (s === "1,2,3,4,5") return "maandag tot vrijdag";
  if (s === "6,7") return "in het weekend";
  return ds.map((d) => WEEK[d]).join(", ");
}
function uren(schema) {
  if (!schema || !schema.length) return "Altijd";
  return schema.map((b) => `${dagen(b.dagen)} van ${b.van.replace(":", "u")} tot ${b.tot.replace(":", "u")}`).join("; ");
}
function geldig(i) {
  if (i.valid_from && i.valid_until) return `Van ${datum(i.valid_from)} tot ${datum(i.valid_until)}`;
  if (i.valid_from) return `Vanaf ${datum(i.valid_from)}`;
  if (i.valid_until) return `Tot ${datum(i.valid_until)}`;
  return "Zonder einddatum";
}
function melding(el, tekst, ok) { el.className = tekst ? "melding " + (ok ? "ok" : "fout") : "melding"; el.textContent = tekst; if (tekst) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
async function post(pad, data) {
  const r = await fetch(apiPad() + pad, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data), cache: "no-store" });
  let j = {};
  try { j = await r.json(); } catch (e) { /* geen JSON */ }
  if (!r.ok) throw new Error(j.fout || "Er ging iets mis. Probeer opnieuw.");
  return j;
}
// foto verkleinen in de gsm (max 900 px, JPEG): sneller doorsturen en minder opslag
function verklein(file) {
  return new Promise((ok, nok) => {
    const img = new Image();
    img.onload = () => {
      const max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      ok(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => nok(new Error("Deze foto kan niet gelezen worden. Probeer een andere."));
    img.src = URL.createObjectURL(file);
  });
}
function fotoBlok(id, verplicht) {
  return `<div class="foto"><div class="voorbeeld" id="${id}-v">&#128100;</div><div class="knoppen">
    <button type="button" class="knop" data-camera="${id}">Foto nemen</button>
    <button type="button" class="knop zacht" data-kies="${id}">Kies een foto</button>
    <input type="file" accept="image/*" capture="user" id="${id}-cam"><input type="file" accept="image/*" id="${id}-file"></div></div>
    <p class="klein" style="margin:10px 0 0">${verplicht ? "Verplicht. " : ""}Een duidelijke foto van je gezicht, zoals op een badge. Enkel de beheerder ziet ze.</p>`;
}
function koppelFoto(id, melder) {
  const kies = async (file) => {
    if (!file) return;
    try {
      FOTO = await verklein(file);
      $(`#${id}-v`).innerHTML = `<img src="${FOTO}" alt="Je foto">`;
      melding(melder, "");
    } catch (e) { melding(melder, e.message); }
  };
  $(`[data-camera="${id}"]`).addEventListener("click", () => $(`#${id}-cam`).click());
  $(`[data-kies="${id}"]`).addEventListener("click", () => $(`#${id}-file`).click());
  $(`#${id}-cam`).addEventListener("change", (e) => kies(e.target.files[0]));
  $(`#${id}-file`).addEventListener("change", (e) => kies(e.target.files[0]));
}
function privacy() {
  const b = INFO.bedrijf;
  return `<details><summary>Privacyverklaring</summary>
    <p>${esc(b.naam)} (${esc(b.verantwoordelijke)}, ${esc(b.adres)}) bewaart je naam, gsm-nummer, e-mailadres, foto en toegangscode om de toegang tot het gebouw te beheren en om te weten wie wanneer binnenkwam. Elke toegang wordt 400 dagen bewaard.</p>
    <p>Je foto dient enkel om je te herkennen. Ze wordt niet gebruikt voor automatische gezichtsherkenning. Gezichtsherkenning zet je enkel zelf aan, met een aparte toestemming op je persoonlijke pagina: dan wordt op je gsm een versleutelde gezichtsafdruk gemaakt die enkel de deurtablets en de gezichtsserver in het gebouw kunnen lezen. Je gegevens blijven op de eigen server in het gebouw en gaan niet naar derden.</p>
    <p>Zodra je geen toegang meer nodig hebt, worden je gegevens en je foto gewist. Je kan altijd vragen om je gegevens in te zien, te verbeteren of te wissen via <a href="mailto:${esc(b.email)}">${esc(b.email)}</a>. Ben je niet tevreden, dan kan je terecht bij de Gegevensbeschermingsautoriteit (gegevensbeschermingsautoriteit.be).</p></details>`;
}
function gezichtUitleg() {
  return `<div class="kaart"><h2><span class="nr">&#9786;</span>Gezichtsherkenning<span class="label">vrijwillig</span></h2>
    <p class="uitleg" style="margin:0">Na het aanmaken kan je op je persoonlijke pagina kiezen om de deur ook met je gezicht te openen. Je code blijft altijd werken.</p></div>`;
}
function gezichtKaart() {
  const g = INFO.gezicht;
  if (!g) return "";
  const kop = `<h2><span class="nr">&#9786;</span>Gezichtsherkenning<span class="label">${g.ingesteld ? "aan" : "vrijwillig"}</span></h2>`;
  if (!g.tablets.length) return `<div class="kaart">${kop}<p class="uitleg" style="margin:0">${g.ingesteld ? "Ingesteld, maar geen enkele deur is er nu klaar voor." : "Nog geen enkele deur is klaar voor gezichtsherkenning. Je code werkt gewoon."}</p></div>`;
  const mist = g.tablets.filter((t) => !t.heeft);
  if (!g.ingesteld) return `<div class="kaart">${kop}
    <p class="uitleg">Open de deur door gewoon voor de tablet of de camera aan de deur te staan. Je scant daarvoor een keer je gezicht met je gsm. Dat duurt een halve minuut. Je code blijft altijd werken.</p>
    <button class="knop" id="gz-start">Gezichtsherkenning instellen</button></div>`;
  return `<div class="kaart">${kop}
    <div class="rij"><span>Sinds</span><span>${esc(datum(g.sinds))}</span></div>
    <div class="rij"><span>Deuren</span><span>${g.tablets.map((t) => `<span class="chip">${esc(t.deur)}${t.heeft ? "" : " (nog niet)"}</span>`).join("")}</span></div>
    ${mist.length ? (g.tablets.some((t) => t.soort === "server" && t.heeft)
      ? `<div class="uitleg">Op ${mist.map((t) => esc(t.deur)).join(", ")} wordt het binnen enkele minuten vanzelf klaargezet.</div>`
      : `<div class="waarschuwing">Op ${mist.map((t) => esc(t.deur)).join(", ")} werkt het nog niet. Scan opnieuw om het daar ook aan te zetten.</div>`) : ""}
    <button class="knop ${mist.length ? "" : "zacht"}" id="gz-start">Opnieuw scannen</button>
    <details style="margin-top:12px"><summary>Uitzetten en wissen</summary>
      <p>De afdruk wordt gewist, ook op de tablets en de gezichtsserver. Je code blijft werken.</p>
      ${INFO.vertrouwd ? "" : `<label for="gz-pin">Je huidige code</label><input id="gz-pin" class="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="${INFO.pin.max}">`}
      <div id="gz-m" class="melding"></div>
      <button class="knop zacht" id="gz-wis">Gezichtsherkenning uitzetten</button></details></div>`;
}
function koppelGezicht() {
  const st = $("#gz-start");
  if (st) st.addEventListener("click", () => toonScan());
  const wis = $("#gz-wis");
  if (wis) wis.addEventListener("click", async () => {
    const pin = INFO.vertrouwd ? "" : $("#gz-pin").value;
    if (!INFO.vertrouwd && !pin) return melding($("#gz-m"), "Vul je huidige code in.");
    wis.disabled = true;
    try { await post("/gezicht", { wissen: true, huidige_pin: pin }); await laad(); }
    catch (e) { melding($("#gz-m"), e.message); wis.disabled = false; }
  });
}

// ---------------------------------------------------------------- scan met de camera van de gsm
const HOUDINGEN = [
  { id: "recht", tekst: "Kijk recht in de camera" },
  { id: "recht1", tekst: "Kijk recht in de camera" },
  { id: "opzij", tekst: "Draai je hoofd langzaam een beetje opzij" },
  { id: "anderekant", tekst: "Nu een beetje naar de andere kant" },
  { id: "kantel", tekst: "Kijk een beetje omhoog" },
  { id: "anderekantel", tekst: "Nu een beetje omlaag" },
  { id: "recht2", tekst: "En nog eens recht in de camera" },
];
let STROOM = null;
function stopCamera() { if (STROOM) { STROOM.getTracks().forEach((t) => t.stop()); STROOM = null; } }

function toonScan() {
  const g = INFO.gezicht;
  $("#titel").textContent = "Gezichtsherkenning";
  $("#ondertitel").textContent = "Een keer scannen met je gsm";
  $("#main").innerHTML = `<div class="kaart" id="stap1"><h2><span class="nr">1</span>Toestemming</h2>
      <div class="toestemming">${esc(g.toestemming.tekst)}</div>
      <label class="vink"><input type="checkbox" id="gz-ok"> Ik geef deze toestemming (versie ${esc(g.toestemming.versie)}).</label>
      ${INFO.vertrouwd ? "" : `<label for="gz-pin">Je huidige code</label><input id="gz-pin" class="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="${INFO.pin.max}">`}
      <div id="gz-m" class="melding"></div>
      <button class="knop" id="gz-cam">Camera starten</button>
      <button class="knop zacht" id="gz-terug">Terug</button></div>`;
  if ($("#gz-pin")) $("#gz-pin").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, ""); });
  $("#gz-terug").addEventListener("click", () => laad());
  $("#gz-cam").addEventListener("click", async () => {
    const m = $("#gz-m");
    if (!$("#gz-ok").checked) return melding(m, "Vink aan dat je de toestemming geeft.");
    const pin = INFO.vertrouwd ? "" : $("#gz-pin").value;
    if (!INFO.vertrouwd && pin.length < INFO.pin.min) return melding(m, "Vul je huidige code in.");
    if (!window.isSecureContext || !navigator.mediaDevices) return melding(m, "De camera werkt enkel via de beveiligde link (https). Open de link uit je bericht opnieuw.");
    const b = $("#gz-cam"); b.disabled = true; b.textContent = "Even geduld...";
    let gz;
    try {
      gz = await import(g.module);
      await gz.laad();
    } catch (e) { b.disabled = false; b.textContent = "Camera starten"; return melding(m, "De gezichtsherkenning kon niet laden. Probeer het opnieuw met wifi."); }
    try {
      STROOM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
    } catch (e) {
      b.disabled = false; b.textContent = "Camera starten";
      return melding(m, e && e.name === "NotAllowedError" ? "Je gaf geen toegang tot de camera. Sta de camera toe in je browser en probeer opnieuw." : "De camera kon niet starten.");
    }
    scannen(gz, pin);
  });
}

async function scannen(gz, pin) {
  const g = INFO.gezicht;
  $("#main").innerHTML = `<div class="kaart"><div class="camera"><video id="gz-v" playsinline muted autoplay></video><div class="ovaal" id="gz-o"></div>
      <div class="tip" id="gz-tip">Camera starten...</div></div>
      <div class="stippen" id="gz-st">${HOUDINGEN.map(() => "<span></span>").join("")}</div>
      <p class="klein" style="text-align:center">Hou je gsm op ooghoogte, in een goed verlichte ruimte. Er wordt geen foto bewaard.</p>
      <button class="knop zacht" id="gz-stop">Annuleren</button></div>`;
  const video = $("#gz-v"), tip = $("#gz-tip"), ovaal = $("#gz-o");
  let stoppen = false;
  $("#gz-stop").addEventListener("click", () => { stoppen = true; stopCamera(); laad(); });
  video.srcObject = STROOM;
  await video.play().catch(() => {});
  await new Promise((r) => { if (video.videoWidth) r(); else video.onloadedmetadata = () => r(); });
  const W = video.videoWidth, H = video.videoHeight;
  const doek = document.createElement("canvas"); doek.width = W; doek.height = H;
  const ctx = doek.getContext("2d", { willReadFrequently: true });
  const opnames = [];   // { houding, invoer }
  let laatsteHoek = "";
  let stap = 0, basis = null, teken1 = 0, teken2 = 0, goedeReeks = 0, stapStart = performance.now(), laatsteTijd = -1;
  const stippen = [...$("#gz-st").children];
  const volgende = (gelukt) => {
    stippen[stap].className = gelukt ? "ok" : "over";
    stap++; goedeReeks = 0; stapStart = performance.now();
  };
  // hoeken in graden; de eerste rechte opname is het nulpunt
  const past = (h) => {
    const id = HOUDINGEN[stap].id;
    if (!basis) return Math.abs(h.draai) < 12 && Math.abs(h.kantel) < 25;
    const d = h.draai - basis.draai, k = h.kantel - basis.kantel;
    if (id.startsWith("recht")) return Math.abs(d) < 6 && Math.abs(k) < 6 && (id !== "recht1" || performance.now() - laatsteOpname > 600);
    if (id === "opzij") { if (Math.abs(d) > 12 && Math.abs(k) < 10) { teken1 = Math.sign(d); return true; } return false; }
    if (id === "anderekant") return d * teken1 < -12 && Math.abs(k) < 10;
    if (id === "kantel") { if (Math.abs(k) > 8 && Math.abs(d) < 10) { teken2 = Math.sign(k); return true; } return false; }
    if (id === "anderekantel") return k * teken2 < -8 && Math.abs(d) < 10;
    return false;
  };
  const diag = new URLSearchParams(location.search).has("diag");
  let laatsteOpname = 0;
  await new Promise((klaar) => {
    const lus = () => {
      if (stoppen) return klaar();
      if (stap >= HOUDINGEN.length) return klaar();
      const nu = performance.now();
      if (video.currentTime !== laatsteTijd) {
        laatsteTijd = video.currentTime;
        let melding = HOUDINGEN[stap].tekst, ok = false;
        const gezichten = gz.zoekVideo(video, nu);
        if (gezichten.length > 1) melding = "Zorg dat enkel jij in beeld bent";
        else if (!gezichten.length) melding = "Breng je gezicht in het ovaal";
        else {
          const pt = gz.vijfPunten(gezichten[0], W, H);
          const h = { ...gz.houding(pt), ...gz.hoek(gezichten[0], W, H) };
          const binnen = pt.every(([x, y]) => x > W * 0.05 && x < W * 0.95 && y > H * 0.05 && y < H * 0.95);
          if (!binnen) melding = "Breng je gezicht in het ovaal";
          else if (h.oog < Math.min(W, H) * 0.09) melding = "Kom wat dichter";
          else if ((laatsteHoek = `${h.draai.toFixed(0)}° ${h.kantel.toFixed(0)}°`) && past(h)) {
            goedeReeks++; ok = true;
            if (goedeReeks >= 3) {
              ctx.drawImage(video, 0, 0, W, H);
              const invoer = gz.uitlijnen(ctx.getImageData(0, 0, W, H), W, H, pt);
              const helder = gz.helderheid(invoer), scherp = gz.scherpte(invoer);
              if (helder < 45) { melding = "Te donker, zoek meer licht"; goedeReeks = 0; ok = false; }
              else if (helder > 215) { melding = "Te fel, draai weg van het licht"; goedeReeks = 0; ok = false; }
              else if (scherp < 25) { melding = "Hou je gsm even stil"; goedeReeks = 0; ok = false; }
              else {
                if (!basis) basis = h;
                opnames.push({ houding: HOUDINGEN[stap].id, invoer });
                laatsteOpname = performance.now();
                volgende(true);
              }
            }
          } else goedeReeks = 0;
        }
        // lukt een zijwaartse houding niet binnen 8 seconden, dan gaan we verder
        if (stap < HOUDINGEN.length && basis && !HOUDINGEN[stap].id.startsWith("recht") && nu - stapStart > 8000) volgende(false);
        if (stap < HOUDINGEN.length) tip.textContent = melding + (diag && gezichten.length === 1 ? ` (${laatsteHoek})` : "");
        ovaal.classList.toggle("goed", ok);
      }
      requestAnimationFrame(lus);
    };
    requestAnimationFrame(lus);
  });
  stopCamera();
  if (stoppen) return;
  verwerk(gz, pin, opnames);
}

async function verwerk(gz, pin, opnames) {
  const g = INFO.gezicht;
  const toon = (tekst) => { $("#main").innerHTML = `<div class="kaart"><h2>Gezichtsherkenning</h2><p class="uitleg" id="gz-tekst">${esc(tekst)}</p><div id="gz-m" class="melding"></div><div id="gz-k"></div></div>`; };
  toon("Afdrukken berekenen...");
  const pauze = () => new Promise((r) => setTimeout(r, 30));
  const afdrukken = [];
  for (let i = 0; i < opnames.length; i++) {
    $("#gz-tekst").textContent = `Afdrukken berekenen ${i + 1} van ${opnames.length}...`;
    await pauze();
    afdrukken.push({ houding: opnames[i].houding, a: gz.afdruk(opnames[i].invoer) });
  }
  // samenhang: elke afdruk moet lijken op het gemiddelde van de rechte opnames (zelfde persoon, geen mislukte opname)
  const recht = afdrukken.filter((x) => x.houding.startsWith("recht"));
  const gem = new Float32Array(192);
  recht.forEach((x) => x.a.forEach((v, i) => { gem[i] += v; }));
  const n = Math.hypot(...gem) || 1; gem.forEach((v, i) => { gem[i] = v / n; });
  const goed = afdrukken.filter((x) => gz.cosinus(x.a, gem) > 0.45).map((x) => x.a).slice(0, g.max);
  const opnieuw = () => { $("#gz-k").innerHTML = `<button class="knop" id="gz-nog">Opnieuw proberen</button><button class="knop zacht" id="gz-terug">Terug</button>`;
    $("#gz-nog").addEventListener("click", () => toonScan()); $("#gz-terug").addEventListener("click", () => laad()); };
  if (!recht.length || goed.length < g.min) {
    $("#gz-tekst").textContent = "";
    melding($("#gz-m"), "De scan lukte niet goed genoeg. Zoek een goed verlichte plek, hou je gsm op ooghoogte en probeer opnieuw.");
    return opnieuw();
  }
  // vergelijken met de eigen profielfoto: waarschuwen als de scan er weinig op lijkt
  let gelijkenis = null;
  if (INFO.foto) {
    try {
      const img = new Image(); img.src = `${apiPad()}/foto?v=${INFO.foto_v}`; await img.decode();
      const gez = gz.zoekBeeld(img);
      if (gez.length === 1) {
        const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
        const cx = c.getContext("2d"); cx.drawImage(img, 0, 0);
        const inv = gz.uitlijnen(cx.getImageData(0, 0, c.width, c.height), c.width, c.height, gz.vijfPunten(gez[0], c.width, c.height));
        gelijkenis = gz.cosinus(gz.afdruk(inv), gem);
      }
    } catch (e) { gelijkenis = null; }
  }
  const bewaar = async () => {
    $("#gz-k").innerHTML = "";
    $("#gz-tekst").textContent = "Versleutelen en bewaren...";
    try {
      const pakket = await gz.versleutel(goed, g);
      await post("/gezicht", { ...pakket, huidige_pin: pin });
      $("#titel").textContent = "Gezichtsherkenning staat aan";
      $("#ondertitel").textContent = "";
      $("#main").innerHTML = `<div class="kaart"><h2>Klaar</h2><p class="uitleg">Binnen een minuut herkent de deur je. Kijk gewoon naar de tablet of de camera naast de deur. Je code blijft ook werken.</p>
        <button class="knop" id="gz-terug">Naar mijn pagina</button></div>`;
      $("#gz-terug").addEventListener("click", () => laad());
    } catch (e) {
      $("#gz-tekst").textContent = "";
      melding($("#gz-m"), e.message); opnieuw();
    }
  };
  if (gelijkenis !== null && gelijkenis < 0.3) {
    $("#gz-tekst").textContent = "";
    melding($("#gz-m"), "Je scan lijkt weinig op je profielfoto. Scande je wel jezelf? Is je profielfoto duidelijk?");
    $("#gz-k").innerHTML = `<button class="knop" id="gz-nog">Opnieuw scannen</button><button class="knop zacht" id="gz-toch">Toch bewaren</button>`;
    $("#gz-nog").addEventListener("click", () => toonScan());
    $("#gz-toch").addEventListener("click", bewaar);
    return;
  }
  bewaar();
}

function toonOngeldig(fout) {
  $("#titel").textContent = "Link niet geldig";
  $("#ondertitel").textContent = "";
  $("#main").innerHTML = `<div class="kaart"><p style="margin:0">${esc(fout || "Deze link werkt niet (meer).")}</p>
    <p class="klein">Vraag een nieuwe link aan ${esc((INFO && INFO.bedrijf.verantwoordelijke) || "de beheerder")}.</p></div>`;
}

function toonUitnodiging() {
  const i = INFO;
  $("#titel").textContent = i.naam ? `Welkom ${i.naam}` : "Welkom";
  $("#ondertitel").textContent = `Maak in een paar stappen je toegang tot ${i.bedrijf.naam} aan.`;
  $("#main").innerHTML = `
    <div class="kaart"><div class="rij"><span>Deuren</span><span>${i.deuren.map((d) => `<span class="chip">${esc(d)}</span>`).join("")}</span></div>
      <div class="rij"><span>Uren</span><span>${esc(uren(i.schema))}</span></div>
      <div class="rij"><span>Geldig</span><span>${esc(geldig(i))}</span></div></div>
    <form id="f" novalidate>
    <div class="kaart"><h2><span class="nr">1</span>Jouw gegevens</h2>
      <div class="twee"><div><label for="vn">Voornaam</label><input id="vn" type="text" autocomplete="given-name" required></div>
        <div><label for="an">Naam</label><input id="an" type="text" autocomplete="family-name" required></div></div>
      <label for="tel">Gsm-nummer</label><input id="tel" type="tel" autocomplete="tel" placeholder="+32 4.. .. .. .." required>
      <label for="mail">E-mailadres</label><input id="mail" type="email" autocomplete="email" required></div>
    <div class="kaart"><h2><span class="nr">2</span>Jouw code</h2>
      <p class="uitleg">Kies zelf ${i.pin.min} tot ${i.pin.max} cijfers. Die typ je op het scherm naast de deur. Kies geen reeks zoals 1234 of je geboortejaar.</p>
      <div class="twee"><div><label for="p1">Code</label><input id="p1" class="pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="${i.pin.max}"></div>
        <div><label for="p2">Nog eens</label><input id="p2" class="pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="${i.pin.max}"></div></div></div>
    <div class="kaart"><h2><span class="nr">3</span>Jouw foto</h2>${fotoBlok("ft", true)}</div>
    ${gezichtUitleg()}
    <div class="kaart"><h2><span class="nr">4</span>Bevestigen</h2>${privacy()}
      <label class="vink"><input type="checkbox" id="ok"> Ik heb de privacyverklaring gelezen en ga akkoord.</label>
      <div id="m" class="melding"></div>
      <button class="knop" id="verstuur" type="submit">Toegang aanmaken</button></div>
    </form>`;
  const m = $("#m");
  const vi = i.voorinvullen || {};
  [["vn", "voornaam"], ["an", "achternaam"], ["tel", "telefoon"], ["mail", "email"]].forEach(([id, k]) => { if (vi[k]) $("#" + id).value = vi[k]; });
  koppelFoto("ft", m);
  ["p1", "p2"].forEach((id) => $("#" + id).addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, ""); }));
  $("#f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const d = { voornaam: $("#vn").value.trim(), achternaam: $("#an").value.trim(), telefoon: $("#tel").value.trim(),
      email: $("#mail").value.trim(), pin: $("#p1").value, pin2: $("#p2").value, foto: FOTO, akkoord: $("#ok").checked };
    if (!d.voornaam || !d.achternaam) return melding(m, "Vul je voornaam en naam in.");
    if (!d.telefoon) return melding(m, "Vul je gsm-nummer in.");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) return melding(m, "Vul een geldig e-mailadres in.");
    if (d.pin.length < i.pin.min || d.pin.length > i.pin.max) return melding(m, `Je code heeft ${i.pin.min} tot ${i.pin.max} cijfers.`);
    if (d.pin !== d.pin2) return melding(m, "De twee codes zijn niet gelijk.");
    if (!FOTO) return melding(m, "Neem of kies eerst een foto.");
    if (!d.akkoord) return melding(m, "Vink aan dat je akkoord gaat met de privacyverklaring.");
    const b = $("#verstuur"); b.disabled = true; b.textContent = "Bezig...";
    try {
      const r = await post("/aanmelden", d);
      // vanaf nu de vaste, persoonlijke link gebruiken
      history.replaceState(null, "", r.url.replace(/^https?:\/\/[^/]+/, ""));
      toonKlaar(r.url, d.voornaam);
    } catch (e) {
      melding(m, e.message); b.disabled = false; b.textContent = "Toegang aanmaken";
    }
  });
}

function toonKlaar(url, voornaam) {
  $("#titel").textContent = `Klaar, ${voornaam}!`;
  $("#ondertitel").textContent = "Je code werkt vanaf nu.";
  $("#main").innerHTML = `<div class="kaart"><h2>Je persoonlijke pagina</h2>
    <p class="uitleg">Bewaar deze pagina, bijvoorbeeld als bladwijzer of op je beginscherm. Hier pas je later je gegevens, foto of code aan. Deel deze link met niemand.</p>
    <div class="link" id="lnk">${esc(url)}</div>
    <button class="knop" id="kopie">Link kopiëren</button>
    <button class="knop zacht" id="verder">Naar mijn pagina</button><div id="m" class="melding"></div></div>`;
  $("#kopie").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(url); melding($("#m"), "Link gekopieerd.", true); }
    catch (e) { melding($("#m"), "Kopiëren lukt niet. Hou de link ingedrukt om ze te kopiëren."); }
  });
  $("#verder").addEventListener("click", () => laad());
}

function toonPersoon() {
  const i = INFO;
  const st = i.status === "active" ? "Actief" : i.status === "retired" ? "Uit dienst" : "Geblokkeerd";
  $("#titel").textContent = `Hallo ${i.voornaam || i.naam}`;
  $("#ondertitel").textContent = `Je toegang bij ${i.bedrijf.naam}`;
  const fotoSrc = i.foto ? `${apiPad()}/foto?v=${i.foto_v}` : "";
  $("#main").innerHTML = `
    <div class="kaart"><div class="profiel"><div class="voorbeeld">${fotoSrc ? `<img src="${fotoSrc}" alt="Je foto">` : ""}</div>
      <div><b>${esc(i.naam)}</b><span class="status"><span class="dot ${esc(i.status)}"></span>${st}</span></div></div>
      <div style="margin-top:12px"><div class="rij"><span>Deuren</span><span>${i.deuren.map((d) => `<span class="chip">${esc(d)}</span>`).join("")}</span></div>
      <div class="rij"><span>Uren</span><span>${esc(uren(i.schema))}</span></div>
      <div class="rij"><span>Geldig</span><span>${esc(geldig(i))}</span></div>
      <div class="rij"><span>Code</span><span>${"&bull;".repeat(i.pin_lengte || 0)} (${i.pin_lengte} cijfers)</span></div></div></div>
    ${i.recent && i.recent.length ? `<div class="kaart"><h2>Laatste toegangen</h2>${i.recent.map((r) => `<div class="rij"><span>${esc(datum(new Date(r.ts * 1000).toISOString()))}</span>
      <span>${esc(r.door)} <span class="dot ${r.opened ? "" : "retired"}" style="${r.opened ? "" : "background:#c62828"}"></span></span></div>`).join("")}</div>` : ""}
    ${gezichtKaart()}
    <form id="f" novalidate class="kaart"><h2>Gegevens aanpassen</h2>
      <p class="uitleg">Vul enkel in wat je wil wijzigen.${i.vertrouwd ? "" : " Ter controle vragen we je huidige code."}</p>
      <label for="tel">Gsm-nummer</label><input id="tel" type="tel" autocomplete="tel" value="${esc(i.telefoon)}">
      <label for="mail">E-mailadres</label><input id="mail" type="email" autocomplete="email" value="${esc(i.email)}">
      <label>Nieuwe foto</label>${fotoBlok("ft", false)}
      <label for="p1">Nieuwe code (optioneel)</label>
      <div class="twee"><input id="p1" class="pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="${i.pin.max}" placeholder="nieuw">
        <input id="p2" class="pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="${i.pin.max}" placeholder="nog eens"></div>
      ${i.vertrouwd ? "" : `<label for="huidig">Je huidige code</label><input id="huidig" class="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="${i.pin.max}">`}
      <div id="m" class="melding"></div>
      <button class="knop" id="bewaar" type="submit">Bewaren</button></form>
    <div class="kaart">${privacy()}</div>`;
  const m = $("#m");
  FOTO = null;
  koppelFoto("ft", m);
  koppelGezicht();
  ["p1", "p2", "huidig"].filter((id) => $("#" + id)).forEach((id) => $("#" + id).addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, ""); }));
  $("#f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const d = { huidige_pin: i.vertrouwd ? "" : $("#huidig").value, telefoon: $("#tel").value.trim(), email: $("#mail").value.trim() };
    if (!i.vertrouwd && !d.huidige_pin) return melding(m, "Vul je huidige code in.");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) return melding(m, "Vul een geldig e-mailadres in.");
    const p1 = $("#p1").value, p2 = $("#p2").value;
    if (p1 || p2) {
      if (p1.length < i.pin.min || p1.length > i.pin.max) return melding(m, `Je nieuwe code heeft ${i.pin.min} tot ${i.pin.max} cijfers.`);
      if (p1 !== p2) return melding(m, "De twee nieuwe codes zijn niet gelijk.");
      d.pin = p1; d.pin2 = p2;
    }
    if (FOTO) d.foto = FOTO;
    const b = $("#bewaar"); b.disabled = true; b.textContent = "Bezig...";
    try {
      await post("/wijzig", d);
      await laad();
      melding($("#m"), d.pin ? "Bewaard. Je nieuwe code werkt binnen een minuut." : "Bewaard.", true);
    } catch (e) {
      melding(m, e.message); b.disabled = false; b.textContent = "Bewaren";
    }
  });
}

async function laad() {
  try {
    const r = await fetch(apiPad() + "/info", { cache: "no-store" });
    INFO = await r.json();
  } catch (e) {
    INFO = null;
    return toonOngeldig("Geen verbinding. Probeer het straks opnieuw.");
  }
  if (INFO.bedrijf) { $("#merk").textContent = INFO.bedrijf.naam; document.title = `Toegang ${INFO.bedrijf.naam}`; }
  if (INFO.soort === "uitnodiging") return toonUitnodiging();
  if (INFO.soort === "persoon") return toonPersoon();
  return toonOngeldig(INFO.fout);
}
laad();
</script>
