<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ED6928">
<title>Delen</title>
<style>
  :root { --o: #ED6928; --tekst: #1d1d1f; --zacht: #6b6b70; --lijn: #e3e3e6; --kaart: #fff; --bg: #fafafa; --ok: #0b8043; --fout: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --tekst: #f2f2f4; --zacht: #a6a6ad; --lijn: #34343a; --kaart: #1a1a1d; --bg: #111113; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--tekst); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .kop { background: var(--o); color: #fff; padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 20px; }
  .kop b { letter-spacing: 0.02em; }
  .kop h1 { margin: 4px 0 0; font-size: 1.35rem; font-weight: 600; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px calc(30px + env(safe-area-inset-bottom, 0px)); }
  textarea { width: 100%; min-height: 190px; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--lijn); background: var(--kaart); color: var(--tekst); resize: vertical; }
  .knoppen { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .knop { display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 12px; border: 1px solid var(--lijn); background: var(--kaart);
    color: var(--tekst); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
  .knop.hoofd { background: var(--o); border-color: var(--o); color: #fff; grid-column: 1 / -1; }
  .melding { margin-top: 12px; font-size: 0.95rem; min-height: 1.4em; }
  .melding.ok { color: var(--ok); } .melding.fout { color: var(--fout); }
  .uitleg { color: var(--zacht); font-size: 0.9rem; margin-top: 14px; }
</style>
</head>
<body>
<div class="kop"><b>Btechnics</b><h1>Tekst delen</h1></div>
<main>
  <textarea id="tekst" aria-label="Tekst"></textarea>
  <div class="knoppen">
    <button class="knop hoofd" id="menu" hidden>Deelmenu</button>
    <a class="knop" id="wa">WhatsApp</a>
    <a class="knop" id="sms">Sms</a>
    <a class="knop" id="mail">Mail</a>
    <button class="knop" id="kopie">Kopieer tekst</button>
  </div>
  <div class="melding" id="melding" role="status"></div>
  <div class="uitleg">Je kiest zelf de ontvanger. Daarna kan je deze pagina sluiten.</div>
</main>
<script>
(function () {
  "use strict";
  var p = new URLSearchParams(location.hash.slice(1));
  // de tekst staat enkel in het stuk na #: dat gaat nooit naar de server. Meteen uit de adresbalk en de geschiedenis halen.
  try { history.replaceState(null, "", location.pathname); } catch (e) { /* geen probleem */ }
  var $ = function (id) { return document.getElementById(id); };
  var onderwerp = p.get("s") || "Btechnics";
  var apple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
  $("tekst").value = p.get("b") || "";
  function links() {
    var t = encodeURIComponent($("tekst").value);
    $("wa").href = "https://wa.me/?text=" + t;
    $("sms").href = (apple ? "sms:&body=" : "sms:?body=") + t;
    $("mail").href = "mailto:?subject=" + encodeURIComponent(onderwerp) + "&body=" + t;
  }
  $("tekst").addEventListener("input", links);
  links();
  function melding(t, ok) { var m = $("melding"); m.textContent = t; m.className = "melding " + (ok ? "ok" : "fout"); }
  $("kopie").addEventListener("click", function () {
    var txt = $("tekst").value;
    var oud = function () {
      var el = $("tekst"); el.focus(); el.select(); el.setSelectionRange(0, txt.length);
      var gelukt = false; try { gelukt = document.execCommand("copy"); } catch (e) { gelukt = false; }
      if (gelukt) melding("Tekst gekopieerd.", true); else melding("Kopiëren lukt hier niet. De tekst is geselecteerd: hou ze ingedrukt en kies Kopiëren.");
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(function () { melding("Tekst gekopieerd.", true); }, oud);
    else oud();
  });
  if (navigator.share) {
    $("menu").hidden = false;
    $("menu").addEventListener("click", function () { navigator.share({ text: $("tekst").value }).catch(function () {}); });
  }
  var w = p.get("w");
  if (w === "wa" || w === "sms" || w === "mail") setTimeout(function () { location.href = $(w).href; }, 120);
})();
</script>
</body>
</html>
